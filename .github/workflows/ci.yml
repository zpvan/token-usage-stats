name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt issues in:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: build c-shared (darwin)
        run: go build -buildmode=c-shared -o /tmp/token-usage-stats-check.dylib .

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build c-shared (linux)
        run: go build -buildmode=c-shared -o /tmp/token-usage-stats-check.so .
