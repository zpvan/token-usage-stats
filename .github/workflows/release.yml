name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-darwin:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            cctarget: arm64-apple-darwin
          - goarch: amd64
            cctarget: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build plugin
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: clang -target ${{ matrix.cctarget }}
        run: |
          mkdir -p dist
          go build -buildmode=c-shared -gcflags="all=-l -N" -trimpath \
            -o "dist/token-usage-stats-${GITHUB_REF_NAME}-darwin-${{ matrix.goarch }}.dylib" .
          rm -f dist/*.h

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            cc: gcc
          - goarch: arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Install arm64 cross compiler
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build plugin
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -buildmode=c-shared -gcflags="all=-l -N" -trimpath \
            -o "dist/token-usage-stats-${GITHUB_REF_NAME}-linux-${{ matrix.goarch }}.so" .
          rm -f dist/*.h

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build-darwin, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.dylib' -o -name '*.so' \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
